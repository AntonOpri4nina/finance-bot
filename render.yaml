services:
  - type: web
    name: finance-bot
    env: python
    pythonVersion: 3.11.9
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    envVars:
      - key: API_TOKEN
        sync: false
      - key: WEBHOOK_URL
        sync: false
    healthCheckPath: /webhook
    autoDeploy: true
    numInstances: 1
    plan: free
    restartPolicy:
      type: always
      maxRetries: 3
      initialDelaySeconds: 10
      maxDelaySeconds: 300
